[tasks.setup]
description = "One-time: download Sublime's syntax_tests binary and link this package"
run         = "./scripts/setup_syntax_tests.sh"

[tasks.gen-tests]
description = "Convert yaml_tests/*.yaml into tests/syntax_test_* (standalone, no binary needed)"
run         = "./scripts/yaml2syntaxtest.py yaml_tests tests"

[tasks.test]
description = "Generate + run syntax tests"
run         = "./scripts/run_tests.sh"
